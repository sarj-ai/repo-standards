name: Sarj verified GitHub checkout
description: Verify PR workspace base/source/tree without packages; requires Git, Python 3.11+ and merge history depth 2+

outputs:
  comparison-base:
    description: >-
      Genuine first parent of the tested merge, or the event base for a head checkout.
      Narrow work only when the baseline has successful CI coverage.
    value: ${{ steps.context.outputs.comparison-base }}
  source-commit:
    description: Verified tested commit; select work from comparison-base to this commit
    value: ${{ steps.context.outputs.source-commit }}
  tree:
    description: Git tree of the verified checkout
    value: ${{ steps.context.outputs.tree }}
  event-head:
    description: PR head bound to the checkout or genuine second parent
    value: ${{ steps.context.outputs.event-head }}
  mode:
    description: head or merge
    value: ${{ steps.context.outputs.mode }}
  pythonpath:
    description: >-
      Immutable owner source. Set PYTHONPATH to this output and run
      python3 -P -S -m repo_standards.github_checkout before emitting a proof.
    value: ${{ steps.context.outputs.pythonpath }}

runs:
  using: composite
  steps:
    - name: Verify the GitHub pull-request checkout
      id: context
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        PYTHONPATH: ${{ github.action_path }}/../src
      run: |
        python3 -P -S -m repo_standards.github_checkout
        printf 'pythonpath=%s\n' "$PYTHONPATH" >>"$GITHUB_OUTPUT"
