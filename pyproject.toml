[project]
name = "repo-standards"
version = "6.12.9"
description = "Deterministic pull-request sizing and reviewed repository policy"
authors = [{ name = "sarj-ai" }]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["architecture", "github-actions", "lint", "openapi", "repository"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Typing :: Typed",
]
requires-python = ">=3.14,<3.16"
dependencies = [
  "conventional-pre-commit==4.4.0",
  "PyYAML>=6.0.3,<7",
  "pydantic>=2.14.1,<3",
  "typer>=0.27.3,<1",
]
readme = "README.md"

[project.urls]
Homepage = "https://repo-standards.sarj.ai"
Repository = "https://github.com/sarj-ai/repo-standards"
Issues = "https://github.com/sarj-ai/repo-standards/issues"
Documentation = "https://repo-standards.sarj.ai"

[project.scripts]
repo-standards = "repo_standards._entrypoint:main"

[dependency-groups]
artifacts = ["jsonschema>=4.26.0"]
hooks = ["pre-commit>=4.7.0,<5"]
dev = [
    "basedpyright>=1.40.2",
    "jsonschema>=4.26.0",
    "pre-commit>=4.7.0,<5",
    "pytest>=9.1.1",
    "pytest-xdist==3.8.0",
  "ruff>=0.17.2",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "repo_standards"

[tool.uv]
# Checksummed managed-Python catalog from the pinned uv release.
python-downloads-json-url = "https://raw.githubusercontent.com/astral-sh/uv/46776a95d6686ac0160c10611327ce491e6b202f/crates/uv-python-managed/download-metadata.json"

[tool.pytest.ini_options]
addopts = "-q --import-mode=importlib"
pythonpath = [".", "src"]
testpaths = ["tests"]

[tool.ruff]
extend = ".ruff-strict.toml"
target-version = "py314"
line-length = 100

[tool.ruff.lint]
extend-select = ["B", "E", "F", "I", "PERF", "PL", "RUF", "S", "SIM", "UP"]

[tool.ruff.per-file-target-version]
# Imported by the system-Python CI certificate bootstrap before project activation.
"test_selection.py" = "py312"

[tool.ruff.lint.extend-per-file-ignores]
"**/tests/**" = ["implicit-namespace-package", "magic-value-comparison", "assert"]
# This dependency-free GitHub adapter validates dynamic provider JSON at every
# boundary and invokes only fixed git/uv executables with exact provider SHAs.
"src/repo_standards/github_review_policy.py" = [
  "any-type",
  "banned-api",
  "f-string-in-exception",
  "line-too-long",
  "print",
  "raise-vanilla-args",
  "raw-string-in-exception",
  "start-process-with-partial-path",
  "suspicious-subprocess-import",
  "suspicious-url-open-usage",
  "too-many-arguments",
  "too-many-locals",
]
# This dependency-free release bootstrap has typed validation around its
# standard-library CLI, environment, HTTP, and JSON boundaries.
"release_reconciliation.py" = ["banned-api"]

# The dependency-free artifact bootstrap validates provider JSON and archive
# provenance before the project's Python environment is available.
"ci_artifacts.py" = ["too-many-locals", "too-many-return-statements"]
"test_selection.py" = ["too-many-return-statements"]
