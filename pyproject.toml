[project]
name = "sarj-repo-lint"
version = "0.1.0"
description = "Deterministic repository architecture and migration linter"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "repo-lint-core==0.1.0",
  "repo-lint-policy-sarj==0.1.0",
  "typer>=0.15.0,<1",
]

[project.urls]
Repository = "https://github.com/sarj-ai/sarj-repo-lint"
Issues = "https://github.com/sarj-ai/sarj-repo-lint/issues"

[project.scripts]
repo-lint = "repo_lint_cli:main"
sarj-repo-lint = "repo_lint_cli:main"

[tool.uv]
package = true

[tool.uv.sources]
repo-lint-core = { workspace = true }
repo-lint-policy-sarj = { workspace = true }

[tool.uv.workspace]
members = ["packages/core", "packages/policy-sarj"]

[dependency-groups]
dev = [
  "basedpyright>=1.31.0",
  "jsonschema>=4.25.0",
  "pytest>=8.4.0",
  "ruff>=0.12.0",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/repo_lint_cli"]

[tool.hatch.build.targets.sdist]
include = ["/src/repo_lint_cli", "/README.md", "/pyproject.toml"]

[tool.pytest.ini_options]
addopts = "-q --import-mode=importlib"
testpaths = ["tests", "packages/core/tests", "packages/policy-sarj/tests"]

[tool.ruff]
extend = ".ruff-strict.toml"
target-version = "py312"
line-length = 100

[tool.ruff.lint]
extend-select = ["B", "E", "F", "I", "PERF", "PL", "RUF", "S", "SIM", "UP"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["magic-value-comparison", "assert"]

[tool.basedpyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = [
  "src",
  "packages/core/src",
  "packages/core/tests",
  "packages/policy-sarj/src",
  "packages/policy-sarj/tests",
  "tests",
]
extraPaths = ["packages/core/src", "packages/policy-sarj/src"]
