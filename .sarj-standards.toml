# Managed by `code-standards setup`; commit this file.
bundle = "8.13.3"
rule_profile = "all"
schema = 4

[capabilities]
disable = [
  "eslint",
  "swiftformat",
  "swiftlint",
  "ktlint",
  "detekt",
  "mobile-security",
  "zizmor",
  "checkov",
]

[artifacts]
durable = [".github/**"]

[dest]
kotlin = "."
python = "."
swift = "."
typescript = "apps/docs"

[hooks]
manager = "pre-commit"
