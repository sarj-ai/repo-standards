# Managed by `code-standards setup`; commit this file.
bundle = "9.11.0"
rule_profile = "all"
schema = 4

[capabilities]
disable = [
  "swiftformat",
  "swiftlint",
  "ktlint",
  "detekt",
  "mobile-security",
  "zizmor",
  "checkov",
  "jscpd",
  "knip",
  "sqlfluff",
]

[artifacts]
durable = [".github/**"]

[dest]
kotlin = "."
python = "."
swift = "."
typescript = "apps/site"

[hooks]
manager = "pre-commit"

[baseline]
diagnostics = "diagnostic-baseline.json"

[ci]
bootstrap = ["npm --prefix apps/site run catalog", "npm --prefix apps/site run sync"]
runner = "ubuntu-latest"
