# Managed by `code-standards setup`; commit this file.
bundle = "8.111.1"
rule_profile = "all"
schema = 4

[capabilities]
disable = [
  "eslint",
  "swiftformat",
  "swiftlint",
  "ktlint",
  "detekt",
  "mobile-security",
  "zizmor",
  "checkov",
  "jscpd",
  "knip",
]

[artifacts]
durable = [".github/**"]

[dest]
kotlin = "."
python = "."
swift = "."
typescript = "apps/site"

[hooks]
manager = "pre-commit"

[baseline]
diagnostics = "diagnostic-baseline.json"

[ci]
runner = "blacksmith-2vcpu-ubuntu-2404"
