name: Sarj documentation policy
description: Reject new README/docs content and limit added Markdown pages

inputs:
  root:
    description: Repository root to inspect
    required: false
    default: .
  base:
    description: Trusted base revision; defaults to the pull-request base SHA
    required: false
    default: ''
  head:
    description: Head revision; defaults to the pull-request head SHA
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      with:
        version: '0.13.5'
        enable-cache: true
        save-cache: false
        cache-dependency-glob: ${{ github.action_path }}/../uv.lock
    - name: Install locked documentation-policy environment
      shell: bash
      run: uv sync --project "$GITHUB_ACTION_PATH/.." --locked --no-dev --python 3.15
    - name: Enforce documentation policy
      shell: bash
      env:
        INPUT_BASE: ${{ inputs.base }}
        INPUT_HEAD: ${{ inputs.head }}
        INPUT_ROOT: ${{ inputs.root }}
        PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: bash "$GITHUB_ACTION_PATH/../.github/scripts/action-documentation.sh"
