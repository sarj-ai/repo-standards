name: Sarj documentation budget
description: Prevent pull requests from adding noisy standalone Markdown pages

inputs:
  root:
    description: Repository root to inspect
    required: false
    default: .
  base:
    description: Trusted base revision; defaults to the pull-request base SHA
    required: false
    default: ''
  head:
    description: Head revision; defaults to the pull-request head SHA
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        version: '0.12.12'
        enable-cache: true
        cache-dependency-glob: ${{ github.action_path }}/../uv.lock
    - name: Install locked documentation-policy environment
      shell: bash
      run: uv sync --project "$GITHUB_ACTION_PATH/.." --locked --no-dev --python 3.14
    - name: Enforce documentation budget
      shell: bash
      env:
        INPUT_BASE: ${{ inputs.base }}
        INPUT_HEAD: ${{ inputs.head }}
        INPUT_ROOT: ${{ inputs.root }}
        PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        base=${INPUT_BASE:-$PR_BASE_SHA}
        head=${INPUT_HEAD:-$PR_HEAD_SHA}
        test -n "$base" || { echo "A trusted base revision is required." >&2; exit 2; }
        test -n "$head" || { echo "A head revision is required." >&2; exit 2; }
        uv run --project "$GITHUB_ACTION_PATH/.." --no-sync repo-standards \
          pull-request documentation "$INPUT_ROOT" --base "$base" --head "$head"
