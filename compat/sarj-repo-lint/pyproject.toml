[project]
name = "sarj-repo-lint"
version = "1.0.0"
description = "Compatibility bridge to the renamed repo-standards distribution."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "sarj-ai" }]
dependencies = ["repo-standards==1.0.0"]

[project.scripts]
repo-standards = "repo_lint.cli:main"
repo-lint = "repo_lint.cli:main"
sarj-repo-lint = "repo_lint.cli:main"

[project.urls]
Homepage = "https://repo-standards.sarj.ai"
Repository = "https://github.com/sarj-ai/repo-standards"
Issues = "https://github.com/sarj-ai/repo-standards/issues"
Documentation = "https://repo-standards.sarj.ai"

[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "sarj_repo_lint_compat"
