name: Build and verify site
description: Install the locked toolchains, then lint, build and verify the documentation site.

runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      with:
        version: '0.13.10'
        enable-cache: true
        cache-dependency-glob: uv.lock
    - name: Install Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '24'
        cache: npm
        cache-dependency-path: apps/site/package-lock.json
    - name: Install locked toolchains
      shell: bash
      run: bash .github/scripts/ci-workflow.sh dependencies
    - name: Install the pinned native tool bootstrap
      shell: bash
      env:
        UV_PYTHON_DOWNLOADS_JSON_URL: https://raw.githubusercontent.com/astral-sh/uv/4ecd0eff2a81e3ffdcd7cfee10d08936e4747c17/crates/uv-python-managed/download-metadata.json
      run: uv run --no-config --no-project --python 3.15.0 --with code-standards==9.76.1 python -m sarj_standards.libs.adoption.native_bootstrap
    - name: Install and attest applicable native tools
      shell: bash
      run: uvx --no-config --isolated --python 3.14 --from sarj-standards-bootstrap code-standards setup --tools-only
    - name: Audit documentation dependency graph
      shell: bash
      run: npm --prefix apps/site audit --audit-level=high
    - name: Verify native TypeScript compiler
      shell: bash
      run: bash .github/scripts/ci-workflow.sh compiler
    - name: Verify generated reference
      shell: bash
      env:
        WORKERS_CI_COMMIT_SHA: ${{ github.sha }}
      run: |
        bash .github/scripts/verify-reference.sh
        uv run --frozen --no-dev --group artifacts python -m repo_standards.verify_release_artifacts --site apps/site/dist
