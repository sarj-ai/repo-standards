name: CI

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false
      - name: Install locked environment
        run: uv sync --frozen
      - name: Test
        run: uv run pytest
      - name: Lint
        run: uv run ruff check .
      - name: Type-check
        run: uv run basedpyright

  gate:
    name: CI / gate
    if: always()
    needs: [validate]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every expected lane
        env:
          VALIDATE_RESULT: ${{ needs.validate.result }}
        run: |
          test "$VALIDATE_RESULT" = success
