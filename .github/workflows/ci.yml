name: CI

on:
  pull_request:
    # Metadata edits leave the tested tree unchanged. Commit policy owns title
    # edits; source validation runs when commits change.
    types: [opened, synchronize, reopened]
  workflow_dispatch:
  schedule:
    - cron: "37 9 * * 1"
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]

permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  credentials:
    name: Public credential policy
    permissions:
      contents: read
    uses: sarj-ai/code-standards/.github/workflows/public-credential-policy.yml@abdc970acf520061367a19f743525b4266a9ab07

  reuse:
    name: REUSE license compliance
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify file licensing with REUSE 6.3.0
        run: >-
          docker run --rm --network none --read-only
          --tmpfs /tmp:rw,noexec,nosuid,size=64m
          --user "$UID" --env HOME=/tmp
          --volume "$GITHUB_WORKSPACE:/data:ro"
          fsfe/reuse@sha256:2748d04c2adeb747c9a44831bc99a9cbfd7bf7ff6fc371a4b63204944e3e47b6 lint

  validate:
    name: Validate / Python 3.15
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: '0.13.10'
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Verify full validation of identical reviewed tree
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: reviewed
        env:
          GH_TOKEN: ${{ github.token }}
          PUSH_BASE: ${{ github.event.before }}
        run: >-
          python ci_reviewed_validation.py reuse
          --repository "$GITHUB_REPOSITORY" --sha "$GITHUB_SHA" --base "$PUSH_BASE"
          --github-output "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY"
      - name: Install locked environment
        if: steps.reviewed.outputs.reused != 'true'
        run: uv sync --locked --python 3.15
      - name: Audit locked dependencies
        run: uv audit --locked
      - name: Lint, typecheck and test independently
        if: steps.reviewed.outputs.reused != 'true'
        env:
          TEST_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
        run: bash .github/scripts/ci-workflow.sh python
      - name: Record successful full PR validation
        if: github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork
        run: >-
          python ci_reviewed_validation.py record --plan "$RUNNER_TEMP/test-plan.json"
          --destination "$RUNNER_TEMP/reviewed-validation"
      - name: Keep immutable full-validation certificate
        if: github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reviewed-validation-${{ github.run_attempt }}
          path: ${{ runner.temp }}/reviewed-validation/proof.json
          if-no-files-found: ignore
          retention-days: 2

  compatibility:
    name: Compatibility / Python 3.14
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: '0.13.10'
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Verify minimum supported runtime
        env:
          STANDARDS_PYTHON: '3.14'
        run: bash .github/scripts/verify-python.sh

  package:
    name: Build and install artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Self-test pull-request commit action
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        uses: ./pull-request-commits
      - name: Self-test verified GitHub checkout action
        if: github.event_name == 'pull_request'
        uses: ./github-checkout
      - name: Self-test documentation budget action
        if: github.event_name == 'pull_request'
        uses: ./documentation
      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: '0.13.10'
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Render exact release identity
        run: >-
          uv run --frozen --no-dev --group artifacts python release_readme.py --readme README.md
          --source-sha "$GITHUB_SHA"
      - name: Build distribution
        run: uv build --no-sources --out-dir dist/repo-standards
      - name: Validate pre-commit hook manifest
        run: |
          uv sync --locked --no-dev --group hooks --group artifacts --python 3.15
          uv run --no-sync pre-commit validate-manifest .pre-commit-hooks.yaml
      - name: Verify wheel and source installs on both supported runtimes
        run: >-
          python release_reconciliation.py verify-installed
          --directory dist/repo-standards
          --version "$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          --smoke-root "$RUNNER_TEMP/repo-standards-install-matrix"
          --checksum dist/SHA256SUMS
      - name: Verify public distribution boundary
        run: >-
          uv run --no-sync python -m repo_standards.verify_release_artifacts
          --distributions dist/repo-standards
      - name: Install wheels into a clean environment
        env:
          SMOKE_ENV: ${{ runner.temp }}/repo-standards-smoke
        run: |
          uv venv --python 3.15 "$SMOKE_ENV"
          uv pip install --python "$SMOKE_ENV/bin/python" \
            dist/repo-standards/repo_standards-*.whl
      - name: Smoke-test installed interfaces
        env:
          FIXTURE_ROOT: ${{ runner.temp }}/repo-standards-fixture
          REPORT_PATH: ${{ runner.temp }}/repo-standards-report.json
          SMOKE_ENV: ${{ runner.temp }}/repo-standards-smoke
        run: bash .github/scripts/ci-workflow.sh smoke
      - name: Add consumer action size fixture
        env:
          FIXTURE_ROOT: ${{ runner.temp }}/repo-standards-fixture
        run: |
          mkdir -p "$FIXTURE_ROOT/tests"
          printf 'assert True\n' >"$FIXTURE_ROOT/tests/test_fixture.py"
          printf 'value = 1\n' >"$FIXTURE_ROOT/production.py"
          git -C "$FIXTURE_ROOT" add .
          git -C "$FIXTURE_ROOT" -c user.name='Repository Lint' \
            -c user.email='repository-lint@example.invalid' commit --quiet -m size-fixture
      - name: Smoke-test pull-request size action
        id: size-action
        uses: ./
        with:
          root: ${{ runner.temp }}/repo-standards-fixture
          base: HEAD^
          head: HEAD
      - name: Verify pull-request size action output
        env:
          COUNTED_LINES: ${{ steps.size-action.outputs.counted-lines }}
          EXCLUDED_LINES: ${{ steps.size-action.outputs.excluded-lines }}
          TOTAL_LINES: ${{ steps.size-action.outputs.total-lines }}
        run: |
          test "$COUNTED_LINES" = 2
          test "$EXCLUDED_LINES" = 0
          test "$TOTAL_LINES" = 2
      - name: Bind tested packages to exact main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: bash .github/scripts/ci-workflow.sh bind dist/repo-standards
      - name: Keep immutable tested main packages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tested-packages-${{ github.run_attempt }}
          path: dist/repo-standards/*
          if-no-files-found: error
          retention-days: 7

  docs:
    env:
      UV_NO_DEV: 'true'
    name: Build documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: '0.13.10'
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/site/package-lock.json
      - name: Install locked toolchains
        run: bash .github/scripts/ci-workflow.sh dependencies
      - name: Install the pinned native tool bootstrap
        env:
          UV_PYTHON_DOWNLOADS_JSON_URL: https://raw.githubusercontent.com/astral-sh/uv/4ecd0eff2a81e3ffdcd7cfee10d08936e4747c17/crates/uv-python-managed/download-metadata.json
        run: uv run --no-config --no-project --python 3.15.0 --with code-standards==9.76.1 python -m sarj_standards.libs.adoption.native_bootstrap
      - name: Install and attest applicable native tools
        run: uvx --no-config --isolated --python 3.14 --from sarj-standards-bootstrap code-standards setup --tools-only
      - name: Audit documentation dependency graph
        run: npm --prefix apps/site audit --audit-level=high
      - name: Verify native TypeScript compiler
        run: bash .github/scripts/ci-workflow.sh compiler
      - name: Verify generated reference
        env:
          WORKERS_CI_COMMIT_SHA: ${{ github.sha }}
        run: |
          bash .github/scripts/verify-reference.sh
          uv run --frozen --no-dev --group artifacts python -m repo_standards.verify_release_artifacts --site apps/site/dist
      - name: Bind verified site to exact main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: bash .github/scripts/ci-workflow.sh bind apps/site/dist
      - name: Keep immutable verified main site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tested-site-${{ github.run_attempt }}
          path: apps/site/dist
          if-no-files-found: error
          retention-days: 1

  packages_gate:
    name: CI / packages
    if: always()
    needs: [validate, compatibility, package]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require all runtime and package checks
        env:
          VALIDATE_RESULT: ${{ needs.validate.result }}
          COMPATIBILITY_RESULT: ${{ needs.compatibility.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
        run: |
          test "$VALIDATE_RESULT" = success
          test "$COMPATIBILITY_RESULT" = success
          test "$PACKAGE_RESULT" = success

  gate:
    name: CI / gate
    if: always()
    needs: [validate, compatibility, package, docs, reuse, credentials]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every expected lane
        env:
          VALIDATE_RESULT: ${{ needs.validate.result }}
          COMPATIBILITY_RESULT: ${{ needs.compatibility.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
          DOCS_RESULT: ${{ needs.docs.result }}
          REUSE_RESULT: ${{ needs.reuse.result }}
          CREDENTIALS_RESULT: ${{ needs.credentials.result }}
        run: |
          test "$VALIDATE_RESULT" = success
          test "$COMPATIBILITY_RESULT" = success
          test "$PACKAGE_RESULT" = success
          test "$DOCS_RESULT" = success
          test "$REUSE_RESULT" = success
          test "$CREDENTIALS_RESULT" = success
