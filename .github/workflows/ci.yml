name: CI

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Validate / Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13', '3.14']
    steps:
      - name: Check out tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false
      - name: Install locked environment
        run: uv sync --locked --python "${{ matrix.python-version }}"
      - name: Test
        run: uv run --python "${{ matrix.python-version }}" pytest

  standards:
    name: Highest Sarj Standards
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false
      - name: Install locked environment
        run: uv sync --locked
      - name: Enforce highest Sarj Standards profile
        run: >-
          uvx --isolated --python 3.14 --from sarj-standards==5.2.0
          sarj-standards check --trust-repository-code

  package:
    name: Build and install artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false
      - name: Build every distribution
        run: uv build --all-packages --out-dir dist
      - name: Install wheels into a clean environment
        run: |
          uv venv --python 3.12 /tmp/repo-lint-smoke
          uv pip install --python /tmp/repo-lint-smoke/bin/python \
            --find-links dist sarj-repo-lint
      - name: Smoke-test installed interfaces
        run: |
          /tmp/repo-lint-smoke/bin/repo-lint --help
          /tmp/repo-lint-smoke/bin/sarj-repo-lint --help
          /tmp/repo-lint-smoke/bin/repo-lint capabilities
          /tmp/repo-lint-smoke/bin/repo-lint schema
          /tmp/repo-lint-smoke/bin/repo-lint report tests/fixtures/smoke \
            --policy sarj --format json

  gate:
    name: CI / gate
    if: always()
    needs: [validate, standards, package]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every expected lane
        env:
          VALIDATE_RESULT: ${{ needs.validate.result }}
          STANDARDS_RESULT: ${{ needs.standards.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
        run: |
          test "$VALIDATE_RESULT" = success
          test "$STANDARDS_RESULT" = success
          test "$PACKAGE_RESULT" = success
