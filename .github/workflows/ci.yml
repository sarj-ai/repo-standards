name: CI

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Validate / Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13', '3.14']
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - name: Check out tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.5'
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked environment
        run: uv sync --locked --python "${{ matrix.python-version }}"
      - name: Test
        run: uv run --python "${{ matrix.python-version }}" pytest

  package:
    name: Build and install artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - name: Check out tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.5'
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Build distribution
        run: uv build --no-sources --out-dir dist/repo-standards
      - name: Verify public distribution boundary
        run: >-
          uv run --frozen python -m repo_standards.verify_release_artifacts
          --distributions dist/repo-standards
      - name: Install wheels into a clean environment
        env:
          SMOKE_ENV: ${{ runner.temp }}/repo-standards-smoke
        run: |
          uv venv --python 3.12 "$SMOKE_ENV"
          uv pip install --python "$SMOKE_ENV/bin/python" \
            dist/repo-standards/repo_standards-*.whl
      - name: Smoke-test installed interfaces
        env:
          FIXTURE_ROOT: ${{ runner.temp }}/repo-standards-fixture
          REPORT_PATH: ${{ runner.temp }}/repo-standards-report.json
          SMOKE_ENV: ${{ runner.temp }}/repo-standards-smoke
        run: |
          "$SMOKE_ENV/bin/repo-standards" --help
          "$SMOKE_ENV/bin/repo-standards" --version
          "$SMOKE_ENV/bin/repo-standards" capabilities
          "$SMOKE_ENV/bin/repo-standards" pull-request size --help
          "$SMOKE_ENV/bin/repo-standards" schema
          "$SMOKE_ENV/bin/repo-standards" schema openapi-analysis
          "$SMOKE_ENV/bin/repo-standards" rest --help
          "$SMOKE_ENV/bin/repo-standards" rest rules
          "$SMOKE_ENV/bin/python" -c \
            'import repo_standards, repo_standards.catalog, repo_standards.openapi, repo_standards.pull_request, repo_standards.repository'
          mkdir -p "$FIXTURE_ROOT/.repo-standards"
          cp tests/fixtures/smoke/.repo-standards/repository.toml \
            "$FIXTURE_ROOT/.repo-standards/repository.toml"
          git -C "$FIXTURE_ROOT" init --quiet
          git -C "$FIXTURE_ROOT" add .
          git -C "$FIXTURE_ROOT" -c user.name='Repository Lint' \
            -c user.email='repository-lint@example.invalid' commit --quiet -m fixture
          "$SMOKE_ENV/bin/repo-standards" report "$FIXTURE_ROOT" \
            --format json > "$REPORT_PATH"
          "$SMOKE_ENV/bin/python" -c \
            'import json, os; from importlib.metadata import version; p=json.load(open(os.environ["REPORT_PATH"])); assert p["completion"] == "complete"; assert p["tool"]["version"] == version("repo-standards")'
      - name: Add consumer action size fixture
        env:
          FIXTURE_ROOT: ${{ runner.temp }}/repo-standards-fixture
        run: |
          mkdir -p "$FIXTURE_ROOT/tests"
          printf 'assert True\n' > "$FIXTURE_ROOT/tests/test_fixture.py"
          printf 'value = 1\n' > "$FIXTURE_ROOT/production.py"
          git -C "$FIXTURE_ROOT" add .
          git -C "$FIXTURE_ROOT" -c user.name='Repository Lint' \
            -c user.email='repository-lint@example.invalid' commit --quiet -m size-fixture
      - name: Smoke-test pull-request size action
        id: size-action
        uses: ./
        with:
          root: ${{ runner.temp }}/repo-standards-fixture
          base: HEAD^
          head: HEAD
      - name: Verify pull-request size action output
        env:
          COUNTED_LINES: ${{ steps.size-action.outputs.counted-lines }}
          EXCLUDED_LINES: ${{ steps.size-action.outputs.excluded-lines }}
          TOTAL_LINES: ${{ steps.size-action.outputs.total-lines }}
        run: |
          test "$COUNTED_LINES" = 1
          test "$EXCLUDED_LINES" = 1
          test "$TOTAL_LINES" = 2

  docs:
    name: Build documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - name: Check out tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.5'
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/docs/package-lock.json
      - name: Install locked toolchains
        run: |
          uv sync --locked --python 3.12
          npm --prefix apps/docs ci --ignore-scripts --no-audit --no-fund
      - name: Verify generated reference
        env:
          WORKERS_CI_COMMIT_SHA: ${{ github.sha }}
        run: |
          npm --prefix apps/docs run lint
          npm --prefix apps/docs run build
          uv run python -m repo_standards.verify_release_artifacts --site apps/docs/dist

  gate:
    name: CI / gate
    if: always()
    needs: [validate, package, docs]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every expected lane
        env:
          VALIDATE_RESULT: ${{ needs.validate.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
          DOCS_RESULT: ${{ needs.docs.result }}
        run: |
          test "$VALIDATE_RESULT" = success
          test "$PACKAGE_RESULT" = success
          test "$DOCS_RESULT" = success
