name: CI

on:
  pull_request:
    # Metadata edits leave the tested tree unchanged. Commit policy owns title
    # edits; source validation runs when commits change.
    types: [opened, synchronize, reopened]
  workflow_dispatch:
  schedule:
    - cron: "37 9 * * 1"
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Validate / Python 3.14
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-24.04' || 'blacksmith-2vcpu-ubuntu-2404' }}
    timeout-minutes: 10
    steps:
      - name: Check out tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.18'
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked environment
        run: uv sync --locked --python 3.14
      - name: Audit locked dependencies
        run: uv audit --locked
      - name: Lint, typecheck and test independently
        env:
          TEST_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
        run: |
          run_check() {
            label="$1"; shift
            started=$SECONDS
            "$@" && result=0 || result=$?
            printf '%s: %ss (exit %s)\n' "$label" "$((SECONDS - started))" "$result" >> "$GITHUB_STEP_SUMMARY"
            return "$result"
          }
          run_check Ruff uv run --no-sync ruff check . & lint_pid=$!
          run_check Typecheck uv run --no-sync basedpyright & types_pid=$!
          run_check Tests uv run --no-sync python test_selection.py --run --base "$TEST_BASE" & tests_pid=$!
          result=0
          wait "$lint_pid" || result=1
          wait "$types_pid" || result=1
          wait "$tests_pid" || result=1
          exit "$result"

  package:
    name: Build and install artifacts
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-24.04' || 'blacksmith-2vcpu-ubuntu-2404' }}
    timeout-minutes: 10
    steps:
      - name: Check out tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Self-test pull-request commit action
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        uses: ./pull-request-commits
      - name: Self-test documentation budget action
        if: github.event_name == 'pull_request'
        uses: ./documentation
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.18'
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Render exact main release identity
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: >-
          python release_reconciliation.py prepare-readme --readme README.md
          --version "$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          --source-sha "$GITHUB_SHA"
      - name: Build distribution
        run: uv build --no-sources --out-dir dist/repo-standards
      - name: Validate pre-commit hook manifest
        run: uv run --frozen --only-group hooks pre-commit validate-manifest .pre-commit-hooks.yaml
      - name: Verify public distribution boundary
        run: >-
          uv run --frozen --no-dev --group artifacts python -m repo_standards.verify_release_artifacts
          --distributions dist/repo-standards
      - name: Install wheels into a clean environment
        env:
          SMOKE_ENV: ${{ runner.temp }}/repo-standards-smoke
        run: |
          uv venv --python 3.14 "$SMOKE_ENV"
          uv pip install --python "$SMOKE_ENV/bin/python" \
            dist/repo-standards/repo_standards-*.whl
      - name: Smoke-test installed interfaces
        env:
          FIXTURE_ROOT: ${{ runner.temp }}/repo-standards-fixture
          REPORT_PATH: ${{ runner.temp }}/repo-standards-report.json
          SMOKE_ENV: ${{ runner.temp }}/repo-standards-smoke
        run: |
          bash .github/scripts/smoke-interfaces.sh
          mkdir -p "$FIXTURE_ROOT/.repo-standards"
          cp tests/fixtures/smoke/.repo-standards/repository.toml \
            "$FIXTURE_ROOT/.repo-standards/repository.toml"
          git -C "$FIXTURE_ROOT" init --quiet
          git -C "$FIXTURE_ROOT" add .
          git -C "$FIXTURE_ROOT" -c user.name='Repository Lint' \
            -c user.email='repository-lint@example.invalid' commit --quiet -m fixture
          "$SMOKE_ENV/bin/repo-standards" report "$FIXTURE_ROOT" \
            --format json > "$REPORT_PATH"
          "$SMOKE_ENV/bin/python" -c \
            'import json, os; from importlib.metadata import version; p=json.load(open(os.environ["REPORT_PATH"])); assert p["completion"] == "complete"; assert p["tool"]["version"] == version("repo-standards")'
      - name: Add consumer action size fixture
        env:
          FIXTURE_ROOT: ${{ runner.temp }}/repo-standards-fixture
        run: |
          mkdir -p "$FIXTURE_ROOT/tests"
          printf 'assert True\n' > "$FIXTURE_ROOT/tests/test_fixture.py"
          printf 'value = 1\n' > "$FIXTURE_ROOT/production.py"
          git -C "$FIXTURE_ROOT" add .
          git -C "$FIXTURE_ROOT" -c user.name='Repository Lint' \
            -c user.email='repository-lint@example.invalid' commit --quiet -m size-fixture
      - name: Smoke-test pull-request size action
        id: size-action
        uses: ./
        with:
          root: ${{ runner.temp }}/repo-standards-fixture
          base: HEAD^
          head: HEAD
      - name: Verify pull-request size action output
        env:
          COUNTED_LINES: ${{ steps.size-action.outputs.counted-lines }}
          EXCLUDED_LINES: ${{ steps.size-action.outputs.excluded-lines }}
          TOTAL_LINES: ${{ steps.size-action.outputs.total-lines }}
        run: |
          test "$COUNTED_LINES" = 1
          test "$EXCLUDED_LINES" = 1
          test "$TOTAL_LINES" = 2
      - name: Bind tested packages to exact main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          printf '%s\n' "$GITHUB_SHA" > dist/repo-standards/SOURCE_COMMIT
      - name: Keep immutable tested main packages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tested-packages-${{ github.run_attempt }}
          path: dist/repo-standards/*
          if-no-files-found: error
          retention-days: 7

  docs:
    env:
      UV_NO_DEV: 'true'
    name: Build documentation
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-24.04' || 'blacksmith-2vcpu-ubuntu-2404' }}
    timeout-minutes: 15
    steps:
      - name: Check out tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.18'
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/docs/package-lock.json
      - name: Install locked toolchains
        run: |
          uv sync --locked --python 3.14 --no-dev & python_pid=$!
          npm --prefix apps/docs ci --ignore-scripts --no-audit --no-fund & node_pid=$!
          result=0
          wait "$python_pid" || result=1
          wait "$node_pid" || result=1
          exit "$result"
      - name: Audit documentation dependency graph
        run: npm --prefix apps/docs audit --audit-level=high
      - name: Verify native TypeScript compiler
        run: test "$(npm --prefix apps/docs exec --offline -- tsc --version)" = 'Version 7.0.2'
      - name: Verify generated reference
        env:
          WORKERS_CI_COMMIT_SHA: ${{ github.sha }}
        run: |
          bash .github/scripts/verify-reference.sh
          uv run --frozen --no-dev --group artifacts python -m repo_standards.verify_release_artifacts --site apps/docs/dist
      - name: Bind verified site to exact main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          printf '%s\n' "$GITHUB_SHA" > apps/docs/dist/SOURCE_COMMIT
      - name: Keep immutable verified main site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tested-site-${{ github.run_attempt }}
          path: apps/docs/dist
          if-no-files-found: error
          retention-days: 1

  gate:
    name: CI / gate
    if: always()
    needs: [validate, package, docs]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every expected lane
        env:
          VALIDATE_RESULT: ${{ needs.validate.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
          DOCS_RESULT: ${{ needs.docs.result }}
        run: |
          test "$VALIDATE_RESULT" = success
          test "$PACKAGE_RESULT" = success
          test "$DOCS_RESULT" = success
