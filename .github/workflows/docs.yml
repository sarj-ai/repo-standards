name: documentation

on:
  # CI's unconditional docs lane already lints, tests, builds, and verifies the
  # public boundary on every PR. This workflow owns post-merge publication.
  push:
    branches: [main]
    paths:
      - 'apps/site/**'
      - 'src/repo_standards/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/deploy/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    env:
      UV_NO_DEV: 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - name: Check out tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Reuse site verified by exact main CI
        if: github.event_name == 'push'
        id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python ci_artifacts.py --repository "$GITHUB_REPOSITORY" --sha "$GITHUB_SHA"
          --kind site --destination apps/site/dist --github-output "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY"
      - name: Build and verify site
        if: steps.reuse.outputs.reused != 'true'
        uses: ./.github/actions/site
      - name: Upload immutable site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: repo-standards-site
          path: apps/site/dist
          if-no-files-found: error
          retention-days: 1

  deploy:
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' &&
      vars.DOCS_DEPLOY_ENABLED == 'true'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: repo-standards-production
      url: https://sarj.ai/engineering/projects/repo-standards/
    defaults:
      run:
        working-directory: apps/site
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - name: Check out deployment configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: .github/deploy/package-lock.json
      - name: Download immutable site
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: repo-standards-site
          path: apps/site/dist
      - name: Install locked deployment toolchain
        run: npm --prefix ../../.github/deploy ci --ignore-scripts --no-audit --no-fund
      - name: Verify production credentials
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bash ../../.github/scripts/ci-workflow.sh credentials
      - name: Deploy immutable site
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: ../../.github/deploy/node_modules/.bin/wrangler deploy --config wrangler.jsonc
      - name: Verify deployed revision and catalog
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: node scripts/verify-deployment.ts
