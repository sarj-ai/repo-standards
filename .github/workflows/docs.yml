name: documentation

on:
  pull_request:
    paths:
      - 'apps/docs/**'
      - 'src/repo_standards/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/docs.yml'
  push:
    branches: [main]
    paths:
      - 'apps/docs/**'
      - 'src/repo_standards/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Check out tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.12.12'
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/docs/package-lock.json
      - name: Install locked toolchains
        run: |
          uv sync --locked --python 3.14
          npm --prefix apps/docs ci --ignore-scripts --no-audit --no-fund
      - name: Lint and build generated reference
        env:
          WORKERS_CI_COMMIT_SHA: ${{ github.sha }}
        run: |
          npm --prefix apps/docs run lint
          npm --prefix apps/docs run build
      - name: Verify public site artifacts
        run: uv run python -m repo_standards.verify_release_artifacts --site apps/docs/dist
      - name: Upload immutable site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: repo-standards-site
          path: apps/docs/dist
          if-no-files-found: error
          retention-days: 1

  deploy:
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' &&
      vars.DOCS_DEPLOY_ENABLED == 'true'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: repo-standards-production
      url: https://repo-standards.sarj.ai
    defaults:
      run:
        working-directory: apps/docs
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Check out deployment configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/docs/package-lock.json
      - name: Download immutable site
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: repo-standards-site
          path: apps/docs/dist
      - name: Install locked deployment toolchain
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify production credentials
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT_ID is not configured"; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN is not configured"; exit 1; }
      - name: Deploy immutable site
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run deploy
      - name: Verify deployed revision and catalog
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: >-
          node -e "const base='https://repo-standards.sarj.ai/'; const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
          (async()=>{let lastError; for(let attempt=1;attempt<=10;attempt+=1){try{const query='?commit='+process.env.EXPECTED_COMMIT+'&attempt='+attempt;
          const [healthResponse,catalogResponse]=await Promise.all([fetch(base+'health.json'+query,{cache:'no-store'}),
          fetch(base+'api/v7/catalog.json'+query,{cache:'no-store'})]); if(!healthResponse.ok||!catalogResponse.ok)throw new Error('reference endpoints are unavailable');
          const health=await healthResponse.json(); const catalog=await catalogResponse.json(); if(health.commit!==process.env.EXPECTED_COMMIT)
          throw new Error('deployed commit does not match'); if(health.catalogDigest!==catalog.provenance.content_digest)
          throw new Error('deployed catalog digest does not match'); console.log('verified '+health.commit); return;}catch(error){lastError=error;
          if(attempt<10)await wait(3000);}}throw lastError;})()"
