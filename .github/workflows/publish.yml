name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  detect:
    name: Detect unpublished version
    if: vars.PACKAGE_PUBLISH_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      artifact_source: ${{ steps.version.outputs.artifact_source }}
      create_tag: ${{ steps.version.outputs.create_tag }}
      prepare_artifacts: ${{ steps.version.outputs.prepare_artifacts }}
      publish_primary: ${{ steps.version.outputs.publish_primary }}
      release: ${{ steps.version.outputs.release }}
      source_sha: ${{ steps.version.outputs.source_sha }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Check out release revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Detect registry state
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python release_reconciliation.py inspect
          --version "$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          --repository "$GITHUB_REPOSITORY"
          --head-sha "$GITHUB_SHA"
          --github-output "$GITHUB_OUTPUT"

  anchor:
    name: Anchor immutable release source
    if: needs.detect.outputs.create_tag == 'true'
    needs: [detect]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Create immutable version tag before publishing
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.detect.outputs.source_sha }}
          RELEASE_VERSION: ${{ needs.detect.outputs.version }}
        run: >-
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs"
          --field "ref=refs/tags/v$RELEASE_VERSION"
          --field "sha=$RELEASE_SHA"

  build:
    name: Prepare and verify release artifacts
    if: >-
      always() &&
      needs.detect.outputs.prepare_artifacts == 'true' &&
      (needs.anchor.result == 'success' || needs.anchor.result == 'skipped')
    needs: [detect, anchor]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Check out trusted main artifact tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: main
      - name: Reuse packages tested by exact main CI
        id: reuse
        if: needs.detect.outputs.artifact_source == 'build'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.detect.outputs.source_sha }}
        run: >-
          python ci_artifacts.py --repository "$GITHUB_REPOSITORY" --sha "$SOURCE_SHA"
          --kind packages --destination "$RUNNER_TEMP/tested-repo-standards"
          --github-output "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY"
      - name: Check out release revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ needs.detect.outputs.source_sha }}
      - name: Restore verified tested bytes after source checkout
        if: steps.reuse.outputs.reused == 'true'
        run: |
          mkdir -p dist/packages/repo-standards
          cp "$RUNNER_TEMP/tested-repo-standards/"* dist/packages/repo-standards/
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.18'
          # Recovery may check out an older immutable source: never populate
          # default-branch caches from that revision. Normal CI caches safely.
          enable-cache: false
      - name: Verify source
        if: needs.detect.outputs.artifact_source == 'build' && steps.reuse.outputs.reused != 'true'
        run: |
          uv sync --locked --python 3.14
          uv audit --locked
          uv run pytest
          uv run ruff check .
          uv run basedpyright
      - name: Render exact release identity
        if: needs.detect.outputs.artifact_source == 'build' && steps.reuse.outputs.reused != 'true'
        run: >-
          python release_reconciliation.py prepare-readme
          --readme README.md
          --version "${{ needs.detect.outputs.version }}"
          --source-sha "${{ needs.detect.outputs.source_sha }}"
      - name: Build publishable artifacts
        if: needs.detect.outputs.artifact_source == 'build' && steps.reuse.outputs.reused != 'true'
        run: uv build --no-sources --out-dir dist/packages/repo-standards
      - name: Reuse surviving registry artifacts
        if: needs.detect.outputs.artifact_source != 'build'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python release_reconciliation.py download
          --source "${{ needs.detect.outputs.artifact_source }}"
          --version "${{ needs.detect.outputs.version }}"
          --repository "$GITHUB_REPOSITORY"
          --source-sha "${{ needs.detect.outputs.source_sha }}"
          --directory dist/packages/repo-standards
      - name: Verify public distribution boundary
        run: >-
          uv run --frozen python -m repo_standards.verify_release_artifacts
          --distributions dist/packages/repo-standards
      - name: Verify exact release identity in package documentation
        run: >-
          python release_reconciliation.py verify-release-identity
          --directory dist/packages/repo-standards
          --version "${{ needs.detect.outputs.version }}"
          --source-sha "${{ needs.detect.outputs.source_sha }}"
      - name: Verify installed wheel and source distribution
        env:
          RELEASE_VERSION: ${{ needs.detect.outputs.version }}
          SMOKE_ROOT: ${{ runner.temp }}/smoke
        run: >-
          python release_reconciliation.py verify-installed
          --directory dist/packages/repo-standards
          --version "$RELEASE_VERSION"
          --smoke-root "$SMOKE_ROOT"
          --checksum dist/SHA256SUMS
      - name: Upload verified artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ needs.detect.outputs.version }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  safety:
    name: Require successful exact main validation
    if: needs.detect.outputs.prepare_artifacts == 'true'
    needs: detect
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - name: Require successful latest own-repository push checks
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ needs.detect.outputs.source_sha }}
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 840))
          for workflow in ci.yml standards.yml; do
            while (( SECONDS < deadline )); do
              response="$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs" -f head_sha="$TARGET_SHA" -f event=push -f per_page=100)"
              run="$(jq -c --arg sha "$TARGET_SHA" --arg repo "$GITHUB_REPOSITORY" '[.workflow_runs[] | select(.head_sha == $sha and .event == "push" and .head_branch == "main" and .head_repository.full_name == $repo)] | max_by(.id) // empty' <<< "$response")"
              conclusion="$(jq -r '.conclusion // empty' <<< "${run:-null}")"
              if [[ "$conclusion" == success ]]; then
                echo "$workflow succeeded at $TARGET_SHA"
                break
              fi
              if [[ -n "$conclusion" ]]; then
                echo "::error::$workflow concluded $conclusion at $TARGET_SHA"
                exit 1
              fi
              sleep 3
            done
            (( SECONDS < deadline )) || { echo "::error::exact main checks timed out"; exit 1; }
          done

  publish_primary:
    name: Publish repo-standards to PyPI
    if: needs.detect.outputs.publish_primary == 'true'
    needs: [detect, build, safety]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: pypi-release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Download verified artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-${{ needs.detect.outputs.version }}
          path: dist
      - name: Verify artifact checksums
        working-directory: dist
        run: sha256sum --check SHA256SUMS
      - name: Verify immutable version tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.detect.outputs.source_sha }}
          RELEASE_VERSION: ${{ needs.detect.outputs.version }}
        run: |
          tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$RELEASE_VERSION" --jq .object.sha)"
          test "$tag_sha" = "$RELEASE_SHA"
      - name: Publish with trusted identity
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/packages/repo-standards

  release:
    name: Create GitHub release
    if: >-
      always() &&
      needs.detect.outputs.release == 'true' &&
      needs.build.result == 'success' &&
      needs.safety.result == 'success' &&
      (needs.publish_primary.result == 'success' || needs.publish_primary.result == 'skipped')
    needs: [detect, build, publish_primary, safety]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Download verified artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-${{ needs.detect.outputs.version }}
          path: dist
      - name: Create immutable release reference
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.detect.outputs.source_sha }}
          RELEASE_VERSION: ${{ needs.detect.outputs.version }}
        run: >-
          gh release create "v$RELEASE_VERSION" dist/packages/*/* dist/SHA256SUMS
          --repo "$GITHUB_REPOSITORY" --target "$RELEASE_SHA"
          --generate-notes
