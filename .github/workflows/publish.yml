name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  detect:
    name: Detect unpublished version
    if: vars.PACKAGE_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      artifact_source: ${{ steps.version.outputs.artifact_source }}
      create_tag: ${{ steps.version.outputs.create_tag }}
      prepare_artifacts: ${{ steps.version.outputs.prepare_artifacts }}
      publish_primary: ${{ steps.version.outputs.publish_primary }}
      release: ${{ steps.version.outputs.release }}
      source_sha: ${{ steps.version.outputs.source_sha }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - name: Check out release revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Detect registry state
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python release_reconciliation.py inspect
          --version "$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          --repository "$GITHUB_REPOSITORY"
          --head-sha "$GITHUB_SHA"
          --github-output "$GITHUB_OUTPUT"

  anchor:
    name: Anchor immutable release source
    if: needs.detect.outputs.create_tag == 'true'
    needs: [detect]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - name: Create immutable version tag before publishing
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.detect.outputs.source_sha }}
          RELEASE_VERSION: ${{ needs.detect.outputs.version }}
        run: >-
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs"
          --field "ref=refs/tags/v$RELEASE_VERSION"
          --field "sha=$RELEASE_SHA"

  build:
    name: Prepare and verify release artifacts
    if: >-
      always() &&
      needs.detect.outputs.prepare_artifacts == 'true' &&
      (needs.anchor.result == 'success' || needs.anchor.result == 'skipped')
    needs: [detect, anchor]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - name: Check out release revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ needs.detect.outputs.source_sha }}
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.5'
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Verify source
        if: needs.detect.outputs.artifact_source == 'build'
        run: |
          uv sync --locked --python 3.14
          uv audit --locked --preview-features audit-command
          uv run pytest
          uv run ruff check .
          uv run basedpyright
      - name: Render exact release identity
        if: needs.detect.outputs.artifact_source == 'build'
        run: >-
          python release_reconciliation.py prepare-readme
          --readme README.md
          --version "${{ needs.detect.outputs.version }}"
          --source-sha "${{ needs.detect.outputs.source_sha }}"
      - name: Build publishable artifacts
        if: needs.detect.outputs.artifact_source == 'build'
        run: uv build --no-sources --out-dir dist/packages/repo-standards
      - name: Reuse surviving registry artifacts
        if: needs.detect.outputs.artifact_source != 'build'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python release_reconciliation.py download
          --source "${{ needs.detect.outputs.artifact_source }}"
          --version "${{ needs.detect.outputs.version }}"
          --repository "$GITHUB_REPOSITORY"
          --source-sha "${{ needs.detect.outputs.source_sha }}"
          --directory dist/packages/repo-standards
      - name: Verify public distribution boundary
        run: >-
          uv run --frozen python verify_release_artifacts.py
          --distributions dist/packages/repo-standards
      - name: Verify exact release identity in package documentation
        run: >-
          python release_reconciliation.py verify-documents
          --directory dist/packages/repo-standards
          --version "${{ needs.detect.outputs.version }}"
          --source-sha "${{ needs.detect.outputs.source_sha }}"
      - name: Verify installed wheel and source distribution
        env:
          RELEASE_VERSION: ${{ needs.detect.outputs.version }}
          SMOKE_ROOT: ${{ runner.temp }}/smoke
        run: |
          test "$(find dist/packages -mindepth 2 -maxdepth 2 -name '*.whl' | wc -l)" -eq 1
          test "$(find dist/packages -mindepth 2 -maxdepth 2 -name '*.tar.gz' | wc -l)" -eq 1
          uv venv --python 3.14 "$SMOKE_ROOT/wheel"
          uv pip install --python "$SMOKE_ROOT/wheel/bin/python" \
            dist/packages/repo-standards/repo_standards-*.whl
          "$SMOKE_ROOT/wheel/bin/repo-standards" --version | grep -Fx "$RELEASE_VERSION"
          "$SMOKE_ROOT/wheel/bin/python" -c 'import repo_lint, repo_lint.core, repo_lint.github, repo_lint.openapi, repo_lint.policy_sarj, repo_lint.rest'
          uv venv --python 3.14 "$SMOKE_ROOT/sdist"
          uv pip install --python "$SMOKE_ROOT/sdist/bin/python" \
            dist/packages/repo-standards/repo_standards-*.tar.gz
          "$SMOKE_ROOT/sdist/bin/repo-standards" --version | grep -Fx "$RELEASE_VERSION"
          if [[ ! -f dist/SHA256SUMS ]]; then
            cd dist
            sha256sum packages/*/* > SHA256SUMS
          fi
      - name: Upload verified artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ needs.detect.outputs.version }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  publish_primary:
    name: Publish repo-standards to PyPI
    if: needs.detect.outputs.publish_primary == 'true'
    needs: [detect, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: pypi-release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - name: Download verified artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-${{ needs.detect.outputs.version }}
          path: dist
      - name: Verify artifact checksums
        working-directory: dist
        run: sha256sum --check SHA256SUMS
      - name: Verify immutable version tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.detect.outputs.source_sha }}
          RELEASE_VERSION: ${{ needs.detect.outputs.version }}
        run: |
          tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$RELEASE_VERSION" --jq .object.sha)"
          test "$tag_sha" = "$RELEASE_SHA"
      - name: Publish with trusted identity
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/packages/repo-standards

  release:
    name: Create GitHub release
    if: >-
      always() &&
      needs.detect.outputs.release == 'true' &&
      needs.build.result == 'success' &&
      (needs.publish_primary.result == 'success' || needs.publish_primary.result == 'skipped')
    needs: [detect, build, publish_primary]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - name: Download verified artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-${{ needs.detect.outputs.version }}
          path: dist
      - name: Create immutable release reference
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.detect.outputs.source_sha }}
          RELEASE_VERSION: ${{ needs.detect.outputs.version }}
        run: >-
          gh release create "v$RELEASE_VERSION" dist/packages/*/* dist/SHA256SUMS
          --repo "$GITHUB_REPOSITORY" --target "$RELEASE_SHA"
          --generate-notes
