name: Sarj pull-request size
description: Measure review-sized pull-request churn without enabling repository lint rules

inputs:
  root:
    description: Repository root to inspect
    required: false
    default: .
  base:
    description: Trusted base revision for pull-request-size
    required: false
    default: ''
  head:
    description: Head revision; defaults to the pull-request head SHA
    required: false
    default: ''
  generated-attribute:
    description: Git attribute marking repository-specific excluded artifacts
    required: false
    default: pr-size-excluded

outputs:
  counted-lines:
    description: Review-sized line count from pull-request-size
    value: ${{ steps.pull-request-size.outputs.counted-lines }}
  excluded-lines:
    description: Line count excluded from review size
    value: ${{ steps.pull-request-size.outputs.excluded-lines }}
  total-lines:
    description: Total changed line count before exclusions
    value: ${{ steps.pull-request-size.outputs.total-lines }}
  report-json:
    description: Bounded canonical JSON summary from pull-request-size
    value: ${{ steps.pull-request-size.outputs.report-json }}
  report-path:
    description: Path to the complete canonical JSON report
    value: ${{ steps.pull-request-size.outputs.report-path }}

runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        version: '0.12.12'
        enable-cache: true
        cache-dependency-glob: ${{ github.action_path }}/uv.lock
    - name: Install locked pull-request-size environment
      shell: bash
      run: uv sync --project "$GITHUB_ACTION_PATH" --locked --no-dev --python 3.14
    - name: Analyze pull-request size
      id: pull-request-size
      shell: bash
      env:
        INPUT_BASE: ${{ inputs.base }}
        INPUT_GENERATED_ATTRIBUTE: ${{ inputs.generated-attribute }}
        INPUT_HEAD: ${{ inputs.head }}
        INPUT_ROOT: ${{ inputs.root }}
        PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        EVENT_SHA: ${{ github.sha }}
      run: |
        base=${INPUT_BASE:-$PR_BASE_SHA}
        head=${INPUT_HEAD:-${PR_HEAD_SHA:-$EVENT_SHA}}
        test -n "$base" || { echo "A base revision is required outside pull_request events; pass base explicitly." >&2; exit 2; }
        test -n "$head" || { echo "A head revision is required." >&2; exit 2; }
        report_path=$(mktemp "$RUNNER_TEMP/repo-standards-pr-size.XXXXXX.json")
        uv run --project "$GITHUB_ACTION_PATH" --no-sync repo-standards pull-request size "$INPUT_ROOT" \
          --base "$base" --head "$head" \
          --generated-attribute "$INPUT_GENERATED_ATTRIBUTE" --report-path "$report_path" >/dev/null
        counted=$(uv run --project "$GITHUB_ACTION_PATH" --no-sync python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["summary"]["counted_lines"])' "$report_path")
        excluded=$(uv run --project "$GITHUB_ACTION_PATH" --no-sync python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["summary"]["excluded_lines"])' "$report_path")
        total=$(uv run --project "$GITHUB_ACTION_PATH" --no-sync python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["summary"]["total_lines"])' "$report_path")
        report=$(uv run --project "$GITHUB_ACTION_PATH" --no-sync python -c 'import json,sys; payload=json.load(open(sys.argv[1], encoding="utf-8")); print(json.dumps({key: value for key, value in payload.items() if key not in {"categories", "directories", "files"}}, sort_keys=True, separators=(",", ":")))' "$report_path")
        echo "counted-lines=$counted" >> "$GITHUB_OUTPUT"
        echo "excluded-lines=$excluded" >> "$GITHUB_OUTPUT"
        echo "total-lines=$total" >> "$GITHUB_OUTPUT"
        echo "report-json=$report" >> "$GITHUB_OUTPUT"
        echo "report-path=$report_path" >> "$GITHUB_OUTPUT"
        printf '## Pull-request size\n\n- Counted: %s lines\n- Excluded: %s lines\n- Total: %s lines\n' \
          "$counted" "$excluded" "$total" >> "$GITHUB_STEP_SUMMARY"
