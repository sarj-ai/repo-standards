name: Sarj repository lint
description: Enforce Sarj repository architecture against the caller's exact checked-out tree

inputs:
  operation:
    description: Operation to run (check or pull-request-size)
    required: false
    default: check
  root:
    description: Repository root to inspect
    required: false
    default: .
  policy:
    description: Installed policy identifier
    required: false
    default: sarj
  mode:
    description: Enforcement mode (report, ratchet, or strict)
    required: false
    default: ratchet
  format:
    description: Output format
    required: false
    default: text
  base:
    description: Trusted base revision for pull-request-size
    required: false
    default: ''
  head:
    description: Head revision for pull-request-size
    required: false
    default: HEAD
  generated-attribute:
    description: Git attribute marking repository-specific excluded artifacts
    required: false
    default: pr-size-excluded

outputs:
  counted-lines:
    description: Review-sized line count from pull-request-size
    value: ${{ steps.pull-request-size.outputs.counted-lines }}
  excluded-lines:
    description: Line count excluded from review size
    value: ${{ steps.pull-request-size.outputs.excluded-lines }}
  total-lines:
    description: Total changed line count before exclusions
    value: ${{ steps.pull-request-size.outputs.total-lines }}
  report-json:
    description: Canonical JSON report from pull-request-size
    value: ${{ steps.pull-request-size.outputs.report-json }}

runs:
  using: composite
  steps:
    - name: Validate operation inputs
      shell: bash
      env:
        INPUT_BASE: ${{ inputs.base }}
        INPUT_OPERATION: ${{ inputs.operation }}
      run: |
        case "$INPUT_OPERATION" in
          check) ;;
          pull-request-size)
            test -n "$INPUT_BASE" || { echo "pull-request-size requires a trusted base revision" >&2; exit 2; }
            ;;
          *)
            echo "Unsupported operation: $INPUT_OPERATION" >&2
            exit 2
            ;;
        esac
    - name: Install uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        version: '0.12.5'
        enable-cache: true
        cache-dependency-glob: ${{ github.action_path }}/uv.lock
    - name: Install locked repository-lint environment
      shell: bash
      run: uv sync --project "$GITHUB_ACTION_PATH" --locked --no-dev --python 3.14
    - name: Enforce repository architecture
      if: inputs.operation == 'check'
      shell: bash
      env:
        INPUT_FORMAT: ${{ inputs.format }}
        INPUT_MODE: ${{ inputs.mode }}
        INPUT_POLICY: ${{ inputs.policy }}
        INPUT_ROOT: ${{ inputs.root }}
      run: >-
        uv run --project "$GITHUB_ACTION_PATH" --no-sync repo-lint check "$INPUT_ROOT"
        --policy "$INPUT_POLICY" --mode "$INPUT_MODE" --format "$INPUT_FORMAT"
    - name: Analyze pull-request size
      id: pull-request-size
      if: inputs.operation == 'pull-request-size'
      shell: bash
      env:
        INPUT_BASE: ${{ inputs.base }}
        INPUT_GENERATED_ATTRIBUTE: ${{ inputs.generated-attribute }}
        INPUT_HEAD: ${{ inputs.head }}
        INPUT_ROOT: ${{ inputs.root }}
      run: |
        report=$(uv run --project "$GITHUB_ACTION_PATH" --no-sync repo-lint pull-request size "$INPUT_ROOT" \
          --base "$INPUT_BASE" --head "$INPUT_HEAD" \
          --generated-attribute "$INPUT_GENERATED_ATTRIBUTE" --format json)
        counted=$(uv run --project "$GITHUB_ACTION_PATH" --no-sync python -c 'import json,sys; print(json.load(sys.stdin)["summary"]["counted_lines"])' <<< "$report")
        excluded=$(uv run --project "$GITHUB_ACTION_PATH" --no-sync python -c 'import json,sys; print(json.load(sys.stdin)["summary"]["excluded_lines"])' <<< "$report")
        total=$(uv run --project "$GITHUB_ACTION_PATH" --no-sync python -c 'import json,sys; print(json.load(sys.stdin)["summary"]["total_lines"])' <<< "$report")
        echo "counted-lines=$counted" >> "$GITHUB_OUTPUT"
        echo "excluded-lines=$excluded" >> "$GITHUB_OUTPUT"
        echo "total-lines=$total" >> "$GITHUB_OUTPUT"
        echo "report-json=$report" >> "$GITHUB_OUTPUT"
        printf '## Pull-request size\n\n- Counted: %s lines\n- Excluded: %s lines\n- Total: %s lines\n' \
          "$counted" "$excluded" "$total" >> "$GITHUB_STEP_SUMMARY"
