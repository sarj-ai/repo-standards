name: Sarj pull-request size
description: Measure review-sized pull-request churn without enabling repository lint rules

inputs:
  root:
    description: Repository root to inspect
    required: false
    default: .
  base:
    description: Trusted base revision for pull-request-size
    required: false
    default: ''
  head:
    description: Head revision; defaults to the pull-request head SHA
    required: false
    default: ''
  generated-attribute:
    description: Git attribute marking repository-specific excluded artifacts
    required: false
    default: pr-size-excluded

outputs:
  counted-lines:
    description: Review-sized line count from pull-request-size
    value: ${{ steps.pull-request-size.outputs.counted-lines }}
  excluded-lines:
    description: Line count excluded from review size
    value: ${{ steps.pull-request-size.outputs.excluded-lines }}
  total-lines:
    description: Total changed line count before exclusions
    value: ${{ steps.pull-request-size.outputs.total-lines }}
  report-json:
    description: Bounded canonical JSON summary from pull-request-size
    value: ${{ steps.pull-request-size.outputs.report-json }}
  report-path:
    description: Path to the complete canonical JSON report
    value: ${{ steps.pull-request-size.outputs.report-path }}

runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      with:
        version: '0.12.24'
        enable-cache: true
        save-cache: false
        cache-dependency-glob: ${{ github.action_path }}/uv.lock
    - name: Install locked pull-request-size environment
      shell: bash
      run: uv sync --project "$GITHUB_ACTION_PATH" --locked --no-dev --python 3.15
    - name: Analyze pull-request size
      id: pull-request-size
      shell: bash
      env:
        INPUT_BASE: ${{ inputs.base }}
        INPUT_GENERATED_ATTRIBUTE: ${{ inputs.generated-attribute }}
        INPUT_HEAD: ${{ inputs.head }}
        INPUT_ROOT: ${{ inputs.root }}
        PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        EVENT_SHA: ${{ github.sha }}
      run: bash "$GITHUB_ACTION_PATH/.github/scripts/action-pull-request-size.sh"
