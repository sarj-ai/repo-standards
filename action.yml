name: Sarj repository lint
description: Enforce Sarj repository architecture against the caller's exact checked-out tree

inputs:
  root:
    description: Repository root to inspect
    required: false
    default: .
  policy:
    description: Installed policy identifier
    required: false
    default: sarj
  mode:
    description: Enforcement mode (report, ratchet, or strict)
    required: false
    default: ratchet
  format:
    description: Output format
    required: false
    default: text

runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        enable-cache: false
    - name: Install locked repository-lint environment
      shell: bash
      run: uv sync --project "$GITHUB_ACTION_PATH" --locked
    - name: Enforce repository architecture
      shell: bash
      env:
        INPUT_FORMAT: ${{ inputs.format }}
        INPUT_MODE: ${{ inputs.mode }}
        INPUT_POLICY: ${{ inputs.policy }}
        INPUT_ROOT: ${{ inputs.root }}
      run: >-
        uv run --project "$GITHUB_ACTION_PATH" repo-lint check "$INPUT_ROOT"
        --policy "$INPUT_POLICY" --mode "$INPUT_MODE" --format "$INPUT_FORMAT"
