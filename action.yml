name: Sarj pull-request size
description: Measure review-sized pull-request churn without enabling repository lint rules

inputs:
  operation:
    description: Deprecated compatibility input; only pull-request-size is accepted
    required: false
    default: ''
  root:
    description: Repository root to inspect
    required: false
    default: .
  policy:
    description: Removed repository-lint input; must remain empty
    required: false
    default: ''
  mode:
    description: Removed repository-lint input; must remain empty
    required: false
    default: ''
  format:
    description: Removed repository-lint input; must remain empty
    required: false
    default: ''
  base:
    description: Trusted base revision for pull-request-size
    required: false
    default: ''
  head:
    description: Head revision; defaults to the pull-request head SHA
    required: false
    default: ''
  generated-attribute:
    description: Git attribute marking repository-specific excluded artifacts
    required: false
    default: pr-size-excluded

outputs:
  counted-lines:
    description: Review-sized line count from pull-request-size
    value: ${{ steps.pull-request-size.outputs.counted-lines }}
  excluded-lines:
    description: Line count excluded from review size
    value: ${{ steps.pull-request-size.outputs.excluded-lines }}
  total-lines:
    description: Total changed line count before exclusions
    value: ${{ steps.pull-request-size.outputs.total-lines }}
  report-json:
    description: Canonical JSON report from pull-request-size
    value: ${{ steps.pull-request-size.outputs.report-json }}

runs:
  using: composite
  steps:
    - name: Validate compatibility inputs
      shell: bash
      env:
        INPUT_FORMAT: ${{ inputs.format }}
        INPUT_MODE: ${{ inputs.mode }}
        INPUT_OPERATION: ${{ inputs.operation }}
        INPUT_POLICY: ${{ inputs.policy }}
      run: |
        if [[ "$INPUT_OPERATION" == "check" || -n "$INPUT_POLICY" || -n "$INPUT_MODE" || -n "$INPUT_FORMAT" ]]; then
          echo "Repository lint rules are disabled pending review. Remove operation/policy/mode/format; this Action now measures pull-request size only. Pin v0.6.0 to retain the previous check behavior." >&2
          exit 2
        fi
        if [[ -n "$INPUT_OPERATION" && "$INPUT_OPERATION" != "pull-request-size" ]]; then
          echo "Unsupported legacy operation: $INPUT_OPERATION" >&2
          exit 2
        fi
    - name: Install uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        version: '0.12.5'
        enable-cache: true
        cache-dependency-glob: ${{ github.action_path }}/uv.lock
    - name: Install locked pull-request-size environment
      shell: bash
      run: uv sync --project "$GITHUB_ACTION_PATH" --locked --no-dev --python 3.12
    - name: Analyze pull-request size
      id: pull-request-size
      shell: bash
      env:
        INPUT_BASE: ${{ inputs.base }}
        INPUT_GENERATED_ATTRIBUTE: ${{ inputs.generated-attribute }}
        INPUT_HEAD: ${{ inputs.head }}
        INPUT_ROOT: ${{ inputs.root }}
        PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        EVENT_SHA: ${{ github.sha }}
      run: |
        base=${INPUT_BASE:-$PR_BASE_SHA}
        head=${INPUT_HEAD:-${PR_HEAD_SHA:-$EVENT_SHA}}
        test -n "$base" || { echo "A base revision is required outside pull_request events; pass base explicitly." >&2; exit 2; }
        test -n "$head" || { echo "A head revision is required." >&2; exit 2; }
        report=$(uv run --project "$GITHUB_ACTION_PATH" --no-sync repo-standards pull-request size "$INPUT_ROOT" \
          --base "$base" --head "$head" \
          --generated-attribute "$INPUT_GENERATED_ATTRIBUTE" --format json)
        counted=$(uv run --project "$GITHUB_ACTION_PATH" --no-sync python -c 'import json,sys; print(json.load(sys.stdin)["summary"]["counted_lines"])' <<< "$report")
        excluded=$(uv run --project "$GITHUB_ACTION_PATH" --no-sync python -c 'import json,sys; print(json.load(sys.stdin)["summary"]["excluded_lines"])' <<< "$report")
        total=$(uv run --project "$GITHUB_ACTION_PATH" --no-sync python -c 'import json,sys; print(json.load(sys.stdin)["summary"]["total_lines"])' <<< "$report")
        echo "counted-lines=$counted" >> "$GITHUB_OUTPUT"
        echo "excluded-lines=$excluded" >> "$GITHUB_OUTPUT"
        echo "total-lines=$total" >> "$GITHUB_OUTPUT"
        echo "report-json=$report" >> "$GITHUB_OUTPUT"
        printf '## Pull-request size\n\n- Counted: %s lines\n- Excluded: %s lines\n- Total: %s lines\n' \
          "$counted" "$excluded" "$total" >> "$GITHUB_STEP_SUMMARY"
