[project]
name = "repo-lint-github"
version = "0.1.0"
description = "Read-only GitHub CI/CD evidence and deterministic workflow policy analysis"
requires-python = ">=3.12"
dependencies = [
  "PyYAML>=6.0.2,<7",
  "repo-lint-core==0.3.0",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/repo_lint_github"]
