[project]
name = "repo-lint-rest"
version = "0.1.0"
description = "Inert REST framework capability detection and operation identity contracts"
requires-python = ">=3.12"
dependencies = [
  "repo-lint-core==0.2.0",
  "repo-lint-openapi==0.1.0",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/repo_lint_rest"]
