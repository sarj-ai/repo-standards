[project]
name = "repo-lint-policy-sarj"
version = "0.1.0"
description = "Sarj repository architecture policy for repo-lint"
requires-python = ">=3.12"
dependencies = ["repo-lint-core"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/repo_lint_policy_sarj"]
