[project]
name = "repo-lint-policy-sarj"
version = "0.3.0"
description = "Sarj repository architecture policy for repo-lint"
requires-python = ">=3.12"
dependencies = ["repo-lint-core==0.3.0"]

[project.entry-points."repo_lint.policies.v1"]
sarj = "repo_lint_policy_sarj:SarjPolicy"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/repo_lint_policy_sarj"]
